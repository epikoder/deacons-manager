# Local dev stack for deacons-manager.
#
#   docker compose up -d
#   ./docker/apply-migrations.sh
#
# PostgREST listens on 3001 to match vite.config.ts, which proxies /rest -> :3001
# and strips the prefix. So the base URL is http://localhost:3001 (no /rest) when
# talking to it directly with curl, and http://localhost:3000/rest through vite.
services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: deacons-pg:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deacons
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deacons"]
      interval: 2s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:latest
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/deacons
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Must match app.jwt_secret on the database (set by apply-migrations.sh).
      PGRST_JWT_SECRET: "dev-only-jwt-secret-change-me-0123456789"
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_LOG_LEVEL: info
    ports: ["3001:3000"]
